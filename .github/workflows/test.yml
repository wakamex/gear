name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: Run the tests, CPU only
        run: zig build test -Dgpu=none
      - name: Install glslc, for the GPU build
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y glslc
      - name: Build with the GPU and echo cancellation, for Linux and Windows
        if: runner.os == 'Linux'
        run: |
          zig build -Doptimize=ReleaseFast -Decho=true
          zig build -Doptimize=ReleaseFast -Decho=true -Dtarget=x86_64-windows-gnu
